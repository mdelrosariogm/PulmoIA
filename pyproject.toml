[project]
name = "pulmoia"
version = "0.1.0"
description = "Detección de sonidos adventicios pulmonares y clasificación de severidad EPOC (COPD0–4) desde auscultación"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "pulmoia team" }]

# ── Dependencias núcleo (stack de datos / audio / ML clásico) ──────────────────
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "librosa>=0.10,<1.0",
    "pandas>=2.0,<4.0",
    "openpyxl>=3.1,<4.0",
    "tqdm>=4.65,<5.0",
    "scikit-learn>=1.3,<2.0",
    "xgboost>=2.0,<4.0",
    "shap>=0.44,<1.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
    "sweetviz>=2.3,<3.0",
]

# ── Extras por fase (se instalan cuando arranca cada fase) ─────────────────────
[project.optional-dependencies]
# Fase 2 (MLflow) + Fase 3 (Prefect)
mlops = [
    "mlflow>=2.12,<3.0",
    "prefect>=2.16,<3.0",
]
# Fase 4 (API REST)
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "python-multipart>=0.0.9",
]

# ── Grupo de desarrollo (Fase 6: testing + calidad de código) ─────────────────
[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulmoia"]

# ── Configuración de herramientas de calidad ──────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle (equivalente a flake8); I = isort; UP = pyupgrade
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # longitud de línea la gestiona black

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
